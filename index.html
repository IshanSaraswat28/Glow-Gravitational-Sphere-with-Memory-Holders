// ============================================================
// AUDIO

let audioCtx=null;
let masterGain=null;
let ambientGain=null;
let ambientFilter=null;
let ambientStarted=false;
let audioReady=false;
let particleAudioTimer=0;
let lastExplosionAudio=0;

function initAudio(){

if(audioReady)return;

try{

audioCtx=new(window.AudioContext||window.webkitAudioContext)();

masterGain=audioCtx.createGain();
masterGain.gain.value=.22;
masterGain.connect(audioCtx.destination);

audioReady=true;

if(audioCtx.state==="suspended")
audioCtx.resume().catch(()=>{});

startAmbient();

}catch(e){
console.warn("Audio unavailable:",e);
}

}

["pointerdown","keydown","touchstart"].forEach(e=>{
window.addEventListener(e,initAudio,{once:true,passive:true});
});


function tone(frequency,duration,type="sine",volume=.025,endFrequency=null){

if(!audioCtx||!masterGain)return;

if(audioCtx.state==="suspended")
audioCtx.resume().catch(()=>{});

const now=audioCtx.currentTime;

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.type=type;

osc.frequency.setValueAtTime(frequency,now);

if(endFrequency)
osc.frequency.exponentialRampToValueAtTime(Math.max(20,endFrequency),now+duration);

gain.gain.setValueAtTime(.0001,now);
gain.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),now+.015);
gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

osc.connect(gain);
gain.connect(masterGain);

osc.start(now);
osc.stop(now+duration+.03);

}


function startAmbient(){

if(!audioReady||ambientStarted)return;

ambientStarted=true;

const now=audioCtx.currentTime;

ambientFilter=audioCtx.createBiquadFilter();
ambientFilter.type="lowpass";
ambientFilter.frequency.value=260;
ambientFilter.Q.value=.45;

ambientGain=audioCtx.createGain();
ambientGain.gain.setValueAtTime(.0001,now);
ambientGain.gain.exponentialRampToValueAtTime(.018,now+1.8);

const hum=audioCtx.createOscillator();
hum.type="sine";
hum.frequency.value=58;

const hum2=audioCtx.createOscillator();
hum2.type="sine";
hum2.frequency.value=116;

const hum2Gain=audioCtx.createGain();
hum2Gain.gain.value=.18;

const lfo=audioCtx.createOscillator();
const lfoGain=audioCtx.createGain();

lfo.type="sine";
lfo.frequency.value=.18;
lfoGain.gain.value=75;

lfo.connect(lfoGain);
lfoGain.connect(ambientFilter.frequency);

hum.connect(ambientFilter);
hum2.connect(hum2Gain);
hum2Gain.connect(ambientFilter);

ambientFilter.connect(ambientGain);
ambientGain.connect(masterGain);

hum.start(now);
hum2.start(now);
lfo.start(now);

}


function particleEnergySound(intensity){

if(!audioReady||!audioCtx)return;

const now=performance.now();

if(now-particleAudioTimer<180)return;

particleAudioTimer=now;

intensity=THREE.MathUtils.clamp(intensity,0,1);

if(intensity<.08)return;

const frequency=THREE.MathUtils.lerp(180,520,intensity);
const volume=THREE.MathUtils.lerp(.002,.008,intensity);

tone(frequency,.16,"sine",volume,frequency*1.8);

}


function explosionSound(intensity){

if(!audioReady||!audioCtx)return;

const now=performance.now();

if(now-lastExplosionAudio<90)return;

lastExplosionAudio=now;

intensity=THREE.MathUtils.clamp(intensity,0,1);

tone(75+intensity*25,.38,"sine",.018+intensity*.025,34);

setTimeout(()=>{
tone(180+intensity*120,.22,"triangle",.012+intensity*.018,850+intensity*500);
},20);

setTimeout(()=>{
tone(1100+intensity*500,.13,"sine",.006+intensity*.012,1750+intensity*500);
},55);

}

// ============================================================

[

// ============================================================
// THREE
// ============================================================

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
.1,
100
);

camera.position.z=5;

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

const composer=new EffectComposer(renderer);

composer.addPass(new RenderPass(scene,camera));

composer.addPass(
new UnrealBloomPass(
new THREE.Vector2(innerWidth,innerHeight),
1.5,
.4,
.1
)
);

const hologram=new THREE.Group();
hologram.scale.setScalar(1.28);
scene.add(hologram);

const core=new THREE.Group();
hologram.add(core);


// ============================================================
// CORE
// ============================================================

const lineMat=(c,o)=>new THREE.LineBasicMaterial({
color:c,
transparent:true,
opacity:o
});

const addLine=(pts,c,o)=>{

const l=new THREE.Line(
new THREE.BufferGeometry().setFromPoints(pts),
lineMat(c,o)
);

core.add(l);
return l;

};


const coreMesh=new THREE.Mesh(
new THREE.IcosahedronGeometry(.30,2),
new THREE.MeshBasicMaterial({
color:"#0278f5",
wireframe:true,
transparent:true,
opacity:.6
})
);

new THREE.IcosahedronGeometry(.15,1),
new THREE.MeshBasicMaterial({
color:"#0288f5",
wireframe:true,
transparent:true,
opacity:.9
})
);

core.add(coreMesh,innerCore);


// ============================================================
// ARCS
// ============================================================

function arc(rx,ry,a0,a1,rX,rY,rZ,o){

const l=addLine(

new THREE.EllipseCurve(
0,0,rx,ry,a0,a1,false,0
)
.getPoints(70)
.map(p=>new THREE.Vector3(p.x,p.y,0)),

0x36dfff,
o

);

l.rotation.set(rX,rY,rZ);

return l;

}

const mainArc1=arc(.78,.38,.15,2.45,.65,.10,.30,.75);
const mainArc2=arc(.78,.38,3.0,5.15,.65,.10,.30,.55);
const sideArc1=arc(.62,.25,0,1.55,1.15,-.45,-.30,.60);
const sideArc2=arc(.62,.25,2.1,4.25,1.15,-.45,-.30,.40);
const vArc1=arc(.50,.20,.30,2.0,Math.PI/2,.35,.15,.50);
const vArc2=arc(.50,.20,3.2,5.4,Math.PI/2,.35,.15,.35);
const thinArc=arc(.92,.12,.4,4.8,.25,1.15,.1,.28);


// ============================================================
// RADIAL DATA
// ============================================================

for(let i=0;i<24;i++){

const a=Math.random()*Math.PI*2;
const r0=.20+Math.random()*.12;
const r1=.48+Math.random()*.45;
const z=(Math.random()-.5)*.35;

addLine([
new THREE.Vector3(Math.cos(a)*r0,Math.sin(a)*r0,z),
new THREE.Vector3(Math.cos(a)*r1,Math.sin(a)*r1,z)
],0x36dfff,.15+Math.random()*.4);

}

for(let i=0;i<34;i++){

const a=i/34*Math.PI*2;
const r=.55+Math.random()*.27;
const l=.025+Math.random()*.10;

addLine([
new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0),
new THREE.Vector3(Math.cos(a)*(r+l),Math.sin(a)*(r+l),0)
],0x8ff7ff,.18+Math.random()*.35);

// ============================================================
// CLOCK
// ============================================================

const clockCv=document.createElement("canvas");
clockCv.width=1024;
clockCv.height=256;

const clockCtx=clockCv.getContext("2d");

const clockTex=new THREE.CanvasTexture(clockCv);
clockTex.colorSpace=THREE.SRGBColorSpace;

const clockSprite=new THREE.Sprite(
new THREE.SpriteMaterial({

transparent:true,
opacity:.95,

})
);

clockSprite.scale.set(1.15,.29,1);

core.add(clockSprite);

let lastSec=-1;

function updateClock(){

const n=new Date();

if(n.getSeconds()===lastSec)return;

lastSec=n.getSeconds();

let h=n.getHours();
const p=h>=12?"PM":"AM";

h=h%12||12;

const t=
String(h).padStart(2,"0")+
":"+
String(n.getMinutes()).padStart(2,"0")+
":"+
String(n.getSeconds()).padStart(2,"0");

const c=clockCtx;

c.clearRect(0,0,1024,256);

c.textAlign="center";
c.textBaseline="middle";

c.font="bold 125px Arial";
c.fillStyle="rgba(210,250,255,.95)";
c.shadowColor="#00d9ff";
c.shadowBlur=25;

c.fillText(t,512,105);

c.shadowBlur=0;

c.font="28px Arial";
c.fillStyle="rgba(80,220,255,.8)";

c.fillText("LOCAL TIME  •  "+p,512,190);

clockTex.needsUpdate=true;

}


// ============================================================
// MEMORY CARDS
// ============================================================

const cardGroup=new THREE.Group();
scene.add(cardGroup);

const cards=[];

MEMORIES.forEach((m,i)=>{

const cv=document.createElement("canvas");
cv.width=512;
cv.height=256;

const tex=new THREE.CanvasTexture(cv);
tex.colorSpace=THREE.SRGBColorSpace;

const mat=new THREE.SpriteMaterial({
map:tex,
transparent:true,
opacity:.8,
depthWrite:false
});

const sprite=new THREE.Sprite(mat);

const N=MEMORIES.length;

const y=1-(i+.5)/N*2;
const r=Math.sqrt(1-y*y);
const th=i*2.399963;

const base=new THREE.Vector3(
Math.cos(th)*r,
y,
Math.sin(th)*r
).multiplyScalar(ORBIT_RADIUS);

sprite.position.copy(base);

cardGroup.add(sprite);

cards.push({
m,cv,
ctx:cv.getContext("2d"),
tex,mat,sprite,base,
phase:Math.random()*6.28,
s:1,
active:false
});

drawCard(cards[i]);

});


function drawCard(c){

const x=c.ctx;
const w=512;
const h=256;
const a=c.active;

x.clearRect(0,0,w,h);

x.fillStyle=a?"rgba(0,50,75,.62)":"rgba(0,15,28,.4)";
x.fillRect(14,14,w-28,h-28);

x.strokeStyle=a?"rgba(170,252,255,.95)":"rgba(54,223,255,.55)";
x.lineWidth=4;

x.beginPath();

[
[25,25,1,1],
[w-25,25,-1,1],
[25,h-25,1,-1],
[w-25,h-25,-1,-1]
].forEach(([cx,cy,sx,sy])=>{

x.moveTo(cx+sx*90,cy);
x.lineTo(cx,cy);
x.lineTo(cx,cy+sy*50);

});

x.stroke();

x.shadowColor="#00d9ff";
x.shadowBlur=12;

x.textAlign="left";
x.textBaseline="middle";

x.font="bold 30px Arial";
x.fillStyle="rgba(70,220,255,.85)";
x.fillText(c.m.title,55,80);

x.font="bold 42px Arial";
x.fillStyle="rgba(215,252,255,.97)";
x.fillText(c.m.caption,55,140);

x.shadowBlur=0;

x.font="20px Arial";
x.fillStyle=a?"rgba(190,252,255,.95)":"rgba(80,210,245,.55)";

const count=c.m.items.length;

let bottomText="EMPTY FOLDER";

if(count===1)bottomText="1 ITEM";
if(count>1)bottomText=count+" ITEMS";
if(a)bottomText="PINCH TO OPEN";

x.fillText(bottomText,55,200);

c.tex.needsUpdate=true;

}

const _v=new THREE.Vector3();

function makeSpinner(group,friction,idleW){

return{
group,
friction,
idleW:idleW||new THREE.Vector3(),
w:new THREE.Vector3(),
F:null,
S:null,
active:false,

function feed(sp,lm){

const now=performance.now();

if(!lm){
sp.active=false;
return;
}

const p=lm[9];

const a=Math.atan2(
lm[9].y-lm[0].y,
lm[9].x-lm[0].x
);

if(!sp.F){

sp.F={x:p.x,y:p.y,a};

}else{

const sd=Math.hypot(
p.x-sp.F.x,
p.y-sp.F.y
);

const k=THREE.MathUtils.clamp(
.22+sd*14,
.22,
.9
);

const oldX=sp.F.x;
const oldY=sp.F.y;
const oldA=sp.F.a;

sp.F.x+=(p.x-sp.F.x)*k;
sp.F.y+=(p.y-sp.F.y)*k;
sp.F.a+=wrapA(a-sp.F.a)*k;

if(sp.S){

const dx=sp.F.x-oldX;
const dy=sp.F.y-oldY;
const da=wrapA(sp.F.a-oldA);

const instant=new THREE.Vector3(
dy*SPIN_GAIN,
-dx*SPIN_GAIN,
da*TWIST_GAIN
);

const velocity=instant.clone().divideScalar(
Math.max(.008,1/60)
);

const speed=velocity.length();

if(speed>.01){

sp.w.lerp(velocity,.35);

if(sp.w.length()>MOMENTUM_MAX)
sp.w.setLength(MOMENTUM_MAX);

}

}

}

sp.active=true;
sp.lastInputTime=now;
sp.momentumLocked=false;

}


function applySpin(g,v){

const ang=v.length();

if(ang<1e-6)return;

_q.setFromAxisAngle(
_v.copy(v).divideScalar(ang),
ang
);

g.quaternion.premultiply(_q).normalize();

}


function updateSpinner(sp,dt){

if(sp.active&&sp.F){

if(!sp.S){

sp.S={
x:sp.F.x,
y:sp.F.y,
a:sp.F.a
};

}

const S=sp.S;
const F=sp.F;

const k=1-Math.exp(-dt*12);

const nx=S.x+(F.x-S.x)*k;
const ny=S.y+(F.y-S.y)*k;
const na=S.a+(F.a-S.a)*k;

_r.set(
(ny-S.y)*SPIN_GAIN,
-(nx-S.x)*SPIN_GAIN,
(na-S.a)*TWIST_GAIN
);

S.x=nx;
S.y=ny;
S.a=na;

applySpin(sp.group,_r);

const measuredVelocity=_r.clone().divideScalar(
Math.max(dt,.001)
);

sp.w.lerp(
measuredVelocity,
1-Math.exp(-dt*16)
);

if(sp.w.length()>MAX_W)
sp.w.setLength(MAX_W);

}else{

sp.S=null;

const sinceInput=sp.lastInputTime
?(performance.now()-sp.lastInputTime)/1000
:999;

let decayRate;

if(sinceInput<.20)
decayRate=sp.braking?14:.45;
else if(sinceInput<.55)
decayRate=sp.braking?14:.9;
else
decayRate=sp.braking?14:MOMENTUM_DECAY;

const f=Math.exp(-dt*decayRate);

sp.w.multiplyScalar(f);

if(sinceInput>.7){

sp.w.lerp(
sp.idleW,
1-Math.exp(-dt*1.5)
);

}

if(sp.w.length()>MAX_W)
sp.w.setLength(MAX_W);

applySpin(
sp.group,
_r.copy(sp.w).multiplyScalar(dt)
);

}

}

const PC=800;

const pPos=new Float32Array(PC*3);
const pVel=new Float32Array(PC*3);

const pPh=new Float32Array(PC);


// ============================================================
// TWINKLING STAR PARTICLES
// ============================================================

const pCol=new Float32Array(PC*3);

const pTwinkle=new Float32Array(PC);

const pTwinkleStrength=new Float32Array(PC);

const pTwinkleSpeed=new Float32Array(PC);

for(let i=0;i<PC;i++){

pPos[i*3]=(Math.random()-.5)*11.5;
pPos[i*3+1]=(Math.random()-.5)*7.8;
pPos[i*3+2]=(Math.random()-.5)*5.8;

for(let k=0;k<3;k++)
pVel[i*3+k]=(Math.random()-.5)*.1;

pRad[i]=.75+Math.random()*.65;
pPh[i]=Math.random()*6.28;


/*
 * Only a few particles are selected.
 * They will occasionally flash yellow.
 */
if(Math.random()<.035){

pTwinkle[i]=Math.random()*Math.PI*2;

pTwinkleStrength[i]=
.75+
Math.random()*.35;

pTwinkleSpeed[i]=
.55+
Math.random()*1.8;

}else{

pTwinkle[i]=-100;
pTwinkleStrength[i]=0;
pTwinkleSpeed[i]=0;

}


/*
 * CYANISH BLUE BASE COLOR.
 *
 * More cyan than the previous royal-blue look.
 */
pCol[i*3]=.015;
pCol[i*3+1]=.62;
pCol[i*3+2]=1.0;

}


const pGeo=new THREE.BufferGeometry();

pGeo.setAttribute(
"position",
new THREE.BufferAttribute(pPos,3)
);

pGeo.setAttribute(
"color",
new THREE.BufferAttribute(pCol,3)
);


/*
 * WHITE material + per-particle colors.
 * This preserves the exact cyan particle color.
 */
const particleMaterial=new THREE.PointsMaterial({

color:0xffffff,

size:.026,

transparent:true,

opacity:.72,

depthWrite:false,

vertexColors:true,

blending:THREE.AdditiveBlending

});


const particlePoints=new THREE.Points(
pGeo,
particleMaterial
);

// ============================================================
// YELLOW TWINKLE
// ============================================================

function updateTwinkles(ms){

const time=ms*.001;

for(let i=0;i<PC;i++){

const phase=pTwinkle[i];

if(phase<0){

/*
 * Normal particles always stay cyan.
 */
pCol[i*3]=.015;
pCol[i*3+1]=.62;
pCol[i*3+2]=1.0;

continue;

}


/*
 * Independent timing for every selected particle.
 */
const wave=
(
Math.sin(
time*pTwinkleSpeed[i]+phase
)+1
)*.5;


/*
 * Very sharp peak.
 *
 * Most of the time:
 * cyan.
 *
 * Very briefly:
 * yellow glowing star.
 */
const flash=
Math.pow(wave,10)*
pTwinkleStrength[i];


/*
 * Start cyan.
 */
const cyanR=.015;
const cyanG=.62;
const cyanB=1.0;


/*
 * Yellow target.
 */
const yellowR=1.0;
const yellowG=.82;
const yellowB=.08;


/*
 * Stronger color change only at the peak.
 */
const mix=
THREE.MathUtils.clamp(
flash*1.15,
0,
1
);


/*
 * Same particle smoothly changes:
 *
 * CYAN → YELLOW → CYAN
 */
let r=
THREE.MathUtils.lerp(
cyanR,
yellowR,
mix
);

let g=
THREE.MathUtils.lerp(
cyanG,
yellowG,
mix
);

let b=
THREE.MathUtils.lerp(
cyanB,
yellowB,
mix
);


/*
 * Add brightness to the yellow flash.
 * All channels are boosted together so it
 * actually blooms like a tiny star.
 */
const glow=
1+
flash*3.5;

r*=glow;
g*=glow;
b*=glow;

pCol[i*3]=r;
pCol[i*3+1]=g;
pCol[i*3+2]=b;

}

pGeo.attributes.color.needsUpdate=true;

}

// PARTICLE EXPLOSION
// ============================================================

function explode(amount){

const strength=THREE.MathUtils.clamp(
amount/9,
0,
1
);

explosionSound(strength);

for(let i=0;i<PC;i++){

const x=pPos[i*3];
const y=pPos[i*3+1];
const z=pPos[i*3+2];

const d=Math.max(.001,Math.hypot(x,y,z));

const f=amount*(2+Math.random()*2.5);

pVel[i*3]+=x/d*f;
pVel[i*3+1]+=y/d*f;
pVel[i*3+2]+=z/d*f;

}

}


// ============================================================
// PARTICLE UPDATE
// ============================================================

function updateParticles(dt,ms){

const ns=THREE.MathUtils.clamp(
smoothScale,
.28,
3
);

const field=THREE.MathUtils.lerp(
.75,
8.5,
(ns-.28)/(3-.28)
);

const damp=Math.pow(.994,dt*60);

let motionEnergy=0;
const sampleStep=20;
let sampleCount=0;

for(let i=0;i<PC;i++){

const j=i*3;

const x=pPos[j];
const y=pPos[j+1];
const z=pPos[j+2];

const d=Math.max(
.001,
Math.hypot(x,y,z)
);

const diff=d-field*pRad[i];

const nx=x/d;
const ny=y/d;
const nz=z/d;

if(diff>0){

const p=
(.38+Math.min(diff*.28,1.8))*dt;

pVel[j]-=nx*p;
pVel[j+1]-=ny*p;
pVel[j+2]-=nz*p;

}else if(diff<-.15){

const p=Math.min(-diff,2)*.085*dt;

pVel[j]+=nx*p;
pVel[j+1]+=ny*p;
pVel[j+2]+=nz*p;

}

const dr=.018*dt;
const ph=pPh[i];

pVel[j]+=
Math.sin(ms*.00035+ph)*dr;

pVel[j+1]+=
Math.cos(ms*.00031+ph)*dr;

pVel[j+2]+=
Math.sin(ms*.00027+ph*1.7)*dr;

pVel[j]*=damp;
pVel[j+1]*=damp;
pVel[j+2]*=damp;

const sp=Math.hypot(
pVel[j],
pVel[j+1],
pVel[j+2]
);

if(sp>4.5){

const f=4.5/sp;

pVel[j]*=f;
pVel[j+1]*=f;
pVel[j+2]*=f;

}

if(i%sampleStep===0){

motionEnergy+=sp;
sampleCount++;

}

pPos[j]+=pVel[j]*dt;
pPos[j+1]+=pVel[j+1]*dt;
pPos[j+2]+=pVel[j+2]*dt;

}

pGeo.attributes.position.needsUpdate=true;


/*
 * Update cyan → yellow → cyan twinkles.
 */
updateTwinkles(ms);


if(sampleCount){

const avgMotion=motionEnergy/sampleCount;

const intensity=THREE.MathUtils.clamp(
avgMotion*.35,
0,
1
);

particleEnergySound(intensity);

}

}

Math.round(
640*
video.videoHeight/
video.videoWidth
);

if(
feedCv.width!==fw||
feedCv.height!==fh
){

feedCv.width=fw;
feedCv.height=fh;

}

feedCtx.drawImage(
video,
0,
0,
fw,
fh
);

try{

await hands.send({
image:feedCv
});

}catch(e){

console.warn(
"Hand tracking:",
e
);

}

processingHands=false;

},

width:CAM_W,
height:CAM_H

}
).start();


// ============================================================
// ANIMATION
// ============================================================

let last=performance.now();

const tmpScale=new THREE.Vector3();

function animate(){

requestAnimationFrame(animate);

const now=performance.now();

const dt=Math.min(
(now-last)/1000,
.033
);

last=now;

smoothScale+=
(
handScale-
smoothScale
)*
(
1-Math.exp(-dt*10)
);

updateSpinner(
holoSpin,
dt
);

if(hasHand){

const ch=handScale-prevHandScale;

if(ch>.32&&handScale>1){

explode(
Math.min(9,ch*11)
);

}

}

prevHandScale=handScale;

const cs=
pinching
?Math.max(.225,smoothScale*.52)
:smoothScale;

core.scale.lerp(
tmpScale.set(cs,cs,cs),
.12
);

coreMesh.rotation.x+=.002;
coreMesh.rotation.y+=.004;

innerCore.rotation.x-=.003;
innerCore.rotation.y+=.006;

mainArc1.rotation.z+=.003;
mainArc2.rotation.z+=.003;

sideArc1.rotation.z-=.004;
sideArc2.rotation.z-=.004;

vArc1.rotation.y+=.003;
vArc2.rotation.y+=.003;

thinArc.rotation.x-=.002;

updateSpinner(
cardSpin,
dt
);

updateParticles(
dt,
now
);

updateCards(
now*.001
);

updateClock();

composer.render();

}

animate();


// ============================================================
// RESIZE
// ============================================================

addEventListener("resize",()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

composer.setSize(
innerWidth,
innerHeight
);

sizeReticle();

fitMedia();

});

</script>
